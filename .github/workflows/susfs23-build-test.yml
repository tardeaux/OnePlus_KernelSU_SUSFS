name: SUSFS 2.3 One-Device Build Test
# Validation rerun against pershoot dev-susfs

on:
  push:
    paths:
      - '.github/workflows/susfs23-build-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix \
            kmod libdw-dev elfutils pigz
      - name: Configure ccache environment
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="${{ github.workspace }}/.ccache"
          CCACHE_LOG="${{ github.workspace }}/ccache.log"
          mkdir -p "$CACHE_DIR"

          SETTINGS=(
            "CCACHE_DIR=$CACHE_DIR"
            "CCACHE_MAXSIZE=12G"
            "CCACHE_COMPILERCHECK=content"
            "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            "CCACHE_NOHASHDIR=true"
            "CCACHE_IGNOREOPTIONS=--sysroot*"
            "CCACHE_COMPRESSION=true"
            "CCACHE_COMPRESSION_LEVEL=3"
            "CCACHE_DIRECT=true"
            "CCACHE_FILE_CLONE=true"
            "CCACHE_INODE_CACHE=true"
            "CCACHE_IS_KERNEL_COMPILING=true"
            "CCACHE_UMASK=002"
            "CCACHE_LOGFILE=${CCACHE_LOG}"
            "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
          )

          for setting in "${SETTINGS[@]}"; do
            export "$setting"
            echo "$setting" >> "$GITHUB_ENV"
          done

          if ccache --help 2>&1 | grep -q 'depend_mode'; then
            echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
          fi

      - name: Build exact release sample
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: '{"model":"OP-ACE-3-PRO","soc":"pineapple","branch":"wild/sm8650","manifest":"oneplus_ace3_pro_w.xml","android_version":"android14","kernel_version":"6.1","os_version":"A16","lto":"thin","zyc_compiler":"","c_compiler":"kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c/bin","rust_compiler":"","bindgen":"","rust_build":false,"disk_cleanup":false,"hmbird":false,"susfs":true,"opt":true,"ds":true,"bbg":true,"bbr":true,"bbr3":true,"ttl":true,"ip_set":true,"unicode":true,"ntsync":true,"blacklist_modules":"kernelsu,oplus_security_guard,oplus_qr_scan,oplus_score,oplus_vip_task,oplus_dns_cache,oplus_network_linkpower_module,oplus_data_module,oplus_secure_harden,oplus_security_keventupload,oplus_secure_guard_new,oplus_secure_guard,coresight_tpda,coresight_tgu,coresight_trace_noc,coresight_cti,coresight_qmi,coresight_dummy,coresight_remote_etm,coresight_tpdm,coresight_uetm,coresight_stm,coresight_tmc_sec,f_fs_ipc_log,qcom_iommu_debug,qti_battery_debug,rdbg,stm_heartbeat,stm_p_ost,stm_core,stm_ftrace,stm_console,spmi_pmic_arb_debug","uname":"OP-WILD"}'
          ksu_type: KSUN
          ksu_branch_or_hash: dev-susfs
          susfs_commit_hash_or_branch: 357d43f13ea2d2bcff709fb63a8dbac76e1ebd64
          optimize_level: O2
          clean: true
          debug: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
